    top_comments: extractComments(text),
    story_analysis: analyzeTextStory(text)
  };
  
  const allLibs = ['hot_meme', 'conflict', 'hook', 'reversal', 'character', 'scene', 
                   'legal_risk', 'vocabulary', 'emotion', 'scenery', 'action', 'dialogue', 'quote'];
  
  allLibs.forEach(function(libKey) {
    const items = extractForLibrary(libKey, mockHotspot);
    items.forEach(function(item) {
      // 移除自动生成的 source 前缀 ID，用截图来源标记
      item.source = 'screenshot';
      item.source_hotspot_id = 'snap_' + Date.now();
      item.source_title = mockHotspot.title;
      
      // 检查是否有实际内容
      let hasContent = false;
      const cfg = LIBRARY_CONFIG[libKey];
      cfg.fields.forEach(function(f) {
        if (!['id', 'source', 'created_at', 'updated_at', 'source_hotspot_id', 'source_title', 'code'].includes(f.key) && item[f.key]) {
          hasContent = true;
        }
      });
      
      if (hasContent) {
        snapAnalysisResults.push({
          library: libKey,
          libraryName: cfg.name,
          libraryIcon: cfg.icon,
          fields: item,
          checked: true
        });
      }
    });
  });
  
  // 额外分析：从文本中直接提取对话
  const dialogues = extractDialoguesFromText(text);
  dialogues.forEach(function(d) {
    snapAnalysisResults.push({
      library: 'dialogue',
      libraryName: '对话素材库',
      libraryIcon: '💬',
      fields: {
        source: 'screenshot',
        source_hotspot_id: 'snap_' + Date.now(),
        source_title: mockHotspot.title,
        character_a: d.speaker || '',
        character_b: '',
        content: d.content,
        scene_context: text.substring(0, 100),
        dialogue_function: '',
        subtext_analysis: '',
        emotion_tone: '',
        rhythm_description: '',
        suitable_genre: ''
      },
      checked: true
    });
  });
  
  // 额外分析：提取金句
  const quotes = extractQuotesFromText(text);
  quotes.forEach(function(q) {
    snapAnalysisResults.push({
      library: 'quote',
      libraryName: '金句素材库',
      libraryIcon: '✨',
      fields: {
        source: 'screenshot',
        source_hotspot_id: 'snap_' + Date.now(),
        source_title: mockHotspot.title,
        quote_text: q,
        author: '',
        source_work: '',
        category: '',
        applicable_scene: '',
        emotion_value: '',
        style_tag: ''
      },
      checked: true
    });
  });
  
  // 渲染结果
  renderSnapResults();
}

// 从文本中提取对话
function extractDialoguesFromText(text) {
  const results = [];
  // 匹配引号对话
  const quotePatterns = [
    /[""]([^""]{10,200})[""]/g,
    /「([^」]{10,200})」/g,
    /『([^』]{10,200})』/g,
    /"([^"]{10,200})"/g
  ];
  
  quotePatterns.forEach(function(pattern) {
    let match;
    while ((match = pattern.exec(text)) !== null) {
      const content = match[1].trim();
      if (content.length >= 5 && !results.some(function(r) { return r.content === content; })) {
        // 尝试找出说话者
        const idx = match.index;
        const before = text.substring(Math.max(0, idx - 30), idx);
        const speakerMatch = before.match(/([\u4e00-\u9fa5]{2,4})(?:说|道|问|答|喊|叫|嚷|吼|骂|笑|哭)/);
        results.push({
          speaker: speakerMatch ? speakerMatch[1] : '',
          content: content
        });
      }
    }
  });
  
  return results.slice(0, 5);
}

// 从文本中提取金句
function extractQuotesFromText(text) {
  const results = [];
  const lines = text.split(/[\n。！？；]/);
  
  lines.forEach(function(line) {
    line = line.trim();
    // 有哲理感的句子（长度适中，含特定词汇）
    if (line.length >= 10 && line.length <= 80) {
      const wisdomWords = ['人生', '命运', '爱情', '幸福', '孤独', '自由', '梦想', '时间', '选择', 
                          '世界', '生活', '灵魂', '希望', '勇气', '坚持', '放下', '成长', '改变',
                          '永远', '曾经', '如果', '也许', '所谓', '真正', '最好', '最后'];
      const matchCount = wisdomWords.filter(function(w) { return line.includes(w); }).length;
      if (matchCount >= 1) {
        results.push(line);
      }
    }
  });
  
  return results.slice(0, 3);
}

// 分析文本的故事属性
function analyzeTextStory(text) {
  const categories = [];
  const keywords = [];
  
  // 冲突检测
  const conflictKws = ['冲突', '矛盾', '争吵', '打架', '对抗', '背叛', '欺骗', '隐瞒', '争夺', '复仇'];
  conflictKws.forEach(function(kw) {
    if (text.includes(kw)) {
      categories.push({category: '社会冲突', story_type: '现实冲突', score: 60});
      keywords.push(kw);
    }
  });
  
  // 情感检测
  const emotionKws = ['爱', '恨', '哭', '泪', '痛', '悲', '喜', '怒', '怕', '悔', '怨', '念', '思'];
  let emotionCount = 0;
  emotionKws.forEach(function(kw) {
    if (text.includes(kw)) {
      emotionCount++;
      keywords.push(kw);
    }
  });
  if (emotionCount >= 2) {
    categories.push({category: '情感冲突', story_type: '情感纠葛', score: 50 + emotionCount * 5});
  }
  
  // 反转检测
  const reversalKws = ['但是', '然而', '没想到', '竟然', '原来', '反转', '真相', '秘密', '其实'];
  for (let ri = 0; ri < reversalKws.length; ri++) {
    const kw = reversalKws[ri];
    if (text.includes(kw)) {
      categories.push({category: '猎奇与反转', story_type: '情节反转', score: 55});
      keywords.push(kw);
      break;
    }
  }
  
  // 场景检测
  const sceneKws = ['法庭', '医院', '婚礼', '葬礼', '办公室', '深夜', '餐厅', '学校', '地铁', '机场', '雨中', '海边', '咖啡', '酒吧'];
  sceneKws.forEach(function(kw) {
    if (text.includes(kw)) {
      keywords.push(kw);
    }
  });
  
  return {
    story_categories: categories,
    matched_keywords: [...new Set(keywords)],
    story_score: Math.min(85, categories.reduce(function(s, c) { return s + c.score; }, 0)),
    emotion_density: Math.min(1, emotionCount / 20),
    is_story_worthy: categories.length > 0,
    story_type: categories.length > 0 ? categories[0].story_type : ''
  };
}

// 从文本中提取评论（模拟）
function extractComments(text) {
  const comments = [];
  const lines = text.split('\n');
  lines.forEach(function(line) {
    line = line.trim();
    if (line.length >= 8 && line.length <= 100 && !line.startsWith('#')) {
      comments.push(line);
    }
  });
  return comments.slice(0, 10);
}

// 渲染分析结果
function renderSnapResults() {
  const container = document.getElementById('snap-analysis-results');
  const listDiv = document.getElementById('snap-results-list');
  const countSpan = document.getElementById('snap-result-count');
  
  if (snapAnalysisResults.length === 0) {
    container.classList.remove('active');
    showToast('未匹配到素材条目，请尝试输入更丰富的内容');
    updateSnapConfirmBtn();
    return;
  }
  
  container.classList.add('active');
  countSpan.textContent = '(' + snapAnalysisResults.length + ' 条匹配)';
  
  let html = '';
  snapAnalysisResults.forEach(function(result, idx) {
    const cfg = LIBRARY_CONFIG[result.library];
    const displayFields = cfg.fields.filter(function(f) {
      return !['id', 'source', 'created_at', 'updated_at', 'source_hotspot_id', 'source_title', 'code'].includes(f.key);
    });
    
    // 只显示有值的字段
    const filledFields = displayFields.filter(function(f) {
      return result.fields[f.key];
    });
    
    html += `
      <div class="snap-result-item" style="${result.checked ? '' : 'opacity:0.5'}">
        <div class="result-header">
          <span class="result-lib">${result.libraryIcon} ${result.libraryName}</span>
          <label style="cursor:pointer;display:flex;align-items:center;gap:4px;font-size:var(--font-xs);color:var(--text-secondary)">
            <input type="checkbox" ${result.checked ? 'checked' : ''} onchange="toggleSnapResult(${idx}, this.checked)" style="accent-color:var(--accent)">
            选择
          </label>
        </div>
        <div class="result-fields">
          ${filledFields.slice(0, 5).map(function(f) {
            const val = String(result.fields[f.key] || '');
            const displayVal = val.length > 60 ? val.substring(0, 60) + '...' : val;
            return '<div class="result-field"><span class="fkey">' + f.label + '</span><span class="fval">' + displayVal + '</span></div>';
          }).join('')}
          ${filledFields.length > 5 ? '<div style="font-size:var(--font-xs);color:var(--text-muted)">... 还有 ' + (filledFields.length - 5) + ' 个字段</div>' : ''}
        </div>
        <div class="result-actions">
          <button class="btn btn-sm btn-secondary" onclick="editSnapResult(${idx})" style="font-size:10px">✏ 编辑</button>
          <button class="btn btn-sm btn-danger" onclick="removeSnapResult(${idx})" style="font-size:10px">× 移除</button>
        </div>
      </div>
    `;
  });
  
  listDiv.innerHTML = html;
  updateSnapConfirmBtn();
}

function toggleSnapResult(idx, checked) {
  if (snapAnalysisResults[idx]) {
    snapAnalysisResults[idx].checked = checked;
  }
  updateSnapConfirmBtn();
  // 更新视觉
  const items = document.querySelectorAll('.snap-result-item');
  if (items[idx]) {
    items[idx].style.opacity = checked ? '' : '0.5';
  }
}

function removeSnapResult(idx) {
  snapAnalysisResults.splice(idx, 1);
  renderSnapResults();
}

function editSnapResult(idx) {
  const result = snapAnalysisResults[idx];
  if (!result) return;
  
  const cfg = LIBRARY_CONFIG[result.library];
  const editableFields = cfg.fields.filter(function(f) {
    return !['id', 'source', 'created_at', 'updated_at', 'source_hotspot_id', 'source_title'].includes(f.key);
  });
  
  let formHtml = editableFields.map(function(f) {
    const val = result.fields[f.key] || '';
    return '<div class="form-group"><label>' + f.label + '</label><input type="text" name="' + f.key + '" value="' + val.replace(/"/g, '&quot;') + '"></div>';
  }).join('');
  
  const overlay = document.createElement('div');
  overlay.className = 'snap-modal-overlay active';
  overlay.style.zIndex = '210';
  overlay.innerHTML = `
    <div class="snap-modal" style="max-width:500px">
      <div class="snap-modal-header">
        <h3>编辑素材 - ${result.libraryIcon} ${result.libraryName}</h3>
        <button class="snap-modal-close" onclick="this.closest('.snap-modal-overlay').remove()">×</button>
      </div>
      <div class="snap-modal-body">
        <form id="snap-edit-form">${formHtml}</form>
      </div>
      <div class="snap-modal-footer">
        <button class="btn btn-secondary" onclick="this.closest('.snap-modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" id="snap-edit-save-btn">保存</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(overlay);
  
  overlay.querySelector('#snap-edit-save-btn').addEventListener('click', function() {
    const form = document.getElementById('snap-edit-form');
    editableFields.forEach(function(f) {
      const input = form.querySelector('[name="' + f.key + '"]');
      if (input) result.fields[f.key] = input.value;
    });
    overlay.remove();
    renderSnapResults();
  });
  
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
}

function updateSnapConfirmBtn() {
  const btn = document.getElementById('snap-confirm-btn');
  if (!btn) return;
  const checkedCount = snapAnalysisResults.filter(function(r) { return r.checked; }).length;
  btn.disabled = checkedCount === 0;
  btn.textContent = checkedCount > 0 ? '确认填入素材库 (' + checkedCount + ' 条)' : '确认填入素材库';
}

function confirmSnapResults() {
  const checked = snapAnalysisResults.filter(function(r) { return r.checked; });
  if (checked.length === 0) {
    showToast('请至少选择一条素材');
    return;
  }
  
  const materials = getMaterials();
  let addedCount = 0;
  
  checked.forEach(function(result) {
    const libKey = result.library;
    if (!materials[libKey]) {
      materials[libKey] = { meta: { name: LIBRARY_CONFIG[libKey].name, version: '1.0', total: 0 }, items: [] };
    }
    
    const item = Object.assign({}, result.fields);
    item.id = 'snap_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    item.created_at = new Date().toISOString();
    item.updated_at = new Date().toISOString();
    
    materials[libKey].items.push(item);
    materials[libKey].meta = materials[libKey].meta || {};
    materials[libKey].meta.total = materials[libKey].items.length;
    materials[libKey].meta.updated_at = new Date().toISOString();
    addedCount++;
  });
  
  saveMaterials(materials);
  closeSnapModal();
  showToast('成功填入 ' + addedCount + ' 条素材！');
  renderMaterials();
}
