<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.5;max-width:100vw;overflow-x:hidden;padding-bottom:70px;-webkit-tap-highlight-color:transparent}

.app-header h1{font-size:var(--font-lg);color:var(--accent);font-weight:700;letter-spacing:0.5px}
.app-header .subtitle{font-size:var(--font-xs);color:var(--text-muted)}
.tab-content{display:none;padding:12px;max-width:800px;margin:0 auto}
.tab-content.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);display:flex;border-top:1px solid var(--border);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,0.04)}
.bottom-nav .nav-item{flex:1;text-align:center;padding:8px 4px;cursor:pointer;color:var(--text-muted);font-size:var(--font-xs);transition:all 0.2s;-webkit-tap-highlight-color:transparent;user-select:none}
.bottom-nav .nav-item.active{color:var(--accent)}

.card{background:var(--bg-card);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent-blue);box-shadow:var(--shadow-hover)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-title{font-size:var(--font-md);font-weight:600;flex:1}
.card-badge{font-size:var(--font-xs);padding:2px 8px;border-radius:10px;background:var(--accent-dim);color:var(--accent);white-space:nowrap;margin-left:8px}
.card-meta{font-size:var(--font-xs);color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
.card-expand{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:var(--font-sm);color:var(--text-secondary)}
.card.expanded .card-expand{display:block}
.tag{display:inline-block;font-size:var(--font-xs);padding:2px 6px;border-radius:4px;background:var(--bg-input);color:var(--text-secondary);margin:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:var(--radius);font-size:var(--font-sm);font-weight:600;border:none;cursor:pointer;transition:all 0.2s;min-height:36px;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(232,115,138,0.25)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--accent-blue);color:#fff;box-shadow:0 2px 8px rgba(91,155,213,0.25)}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:4px 10px;font-size:var(--font-xs);min-height:28px}
.btn-danger{background:var(--danger);color:#fff}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-bar input,.search-bar select{padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);font-size:var(--font-sm);flex:1;min-width:100px;outline:none}
.search-bar input:focus,.search-bar select:focus{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(91,155,213,0.1)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:14px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow)}
.stat-card .stat-value{font-size:var(--font-xxl);font-weight:700;color:var(--accent)}
.stat-card .stat-label{font-size:var(--font-xs);color:var(--text-muted);margin-top:4px}

.library-main{flex:1;min-width:0}
.library-group{margin-bottom:8px}
.library-group-header{padding:8px 10px;font-size:var(--font-xs);color:var(--text-secondary);font-weight:700;cursor:pointer;background:var(--accent-blue-light);border-radius:var(--radius);display:flex;align-items:center;gap:4px}
.library-group-items{display:none;padding:4px 0 4px 8px}
.library-group.open .library-group-items{display:block}
.library-item{padding:8px 10px;font-size:var(--font-sm);cursor:pointer;border-radius:var(--radius);color:var(--text-secondary);margin:2px 0;transition:all 0.2s}

.modal-overlay.active{display:flex}

.library-group-header{font-size:10px;padding:6px 8px}
.material-table{font-size:10px}
.material-table td{max-width:100px}
.stats-grid{grid-template-columns:repeat(2,1fr)}

<script>
// ==================== Application Logic ====================
(function() {
'use strict';

// ==================== Data Layer ====================
const STORAGE_KEY_HOTSPOTS = 'lyz_hotspots';
const STORAGE_KEY_MATERIALS = 'lyz_materials';
const STORAGE_KEY_PROJECTS = 'lyz_projects';
const INIT_KEY = 'lyz_initialized';
const UPDATE_KEY = 'lyz_last_update';

// GitHub Pages 数据地址（替换为你的仓库名）
const DATA_BASE = '';

function getHotspots() {
  let data = localStorage.getItem(STORAGE_KEY_HOTSPOTS);
  if (data) return JSON.parse(data);
  return EMBEDDED_HOTSPOTS;
}

function saveHotspots(data) {
  localStorage.setItem(STORAGE_KEY_HOTSPOTS, JSON.stringify(data));
  localStorage.setItem(UPDATE_KEY, Date.now());
}

async function refreshHotspotsFromRemote() {
  try {
    let resp = await fetch(DATA_BASE + 'hotspots.json', {cache: 'no-cache'});
    if (resp.ok) {
      let data = await resp.json();
      saveHotspots(data);
      console.log('热点数据已从远程更新');
      return data;
    }
  } catch(e) {
    console.log('无法从远程获取热点数据，使用本地数据');
  }
  return getHotspots();
}

function getMaterials() {
  let data = localStorage.getItem(STORAGE_KEY_MATERIALS);
  if (data) return JSON.parse(data);
  return EMBEDDED_MATERIALS;
}

function saveMaterials(data) {
  localStorage.setItem(STORAGE_KEY_MATERIALS, JSON.stringify(data));
}

async function refreshMaterialsFromRemote() {
  let materials = {};
  try {
    let resp = await fetch(DATA_BASE + 'material_index.json', {cache: 'no-cache'});
    if (resp.ok) {
      let index = await resp.json();
      for (let key of Object.keys(index)) {
        try {
          let mr = await fetch(DATA_BASE + 'material_archive/' + key + '.json', {cache: 'no-cache'});
          if (mr.ok) {
            materials[key] = await mr.json();
          }
        } catch(e) {}
      }
      if (Object.keys(materials).length > 0) {
        saveMaterials(materials);
        console.log('素材库数据已从远程更新');
        return materials;
      }
    }
  } catch(e) {
    console.log('无法从远程获取素材库数据，使用本地数据');
  }
  return getMaterials();
}

async function initData() {
  // 尝试从远程加载最新数据
  let hotspots = await refreshHotspotsFromRemote();
  let materials = await refreshMaterialsFromRemote();
  return { hotspots, materials };
}

function getProjects() {
  let data = localStorage.getItem(STORAGE_KEY_PROJECTS);
  return data ? JSON.parse(data) : [];
}

function saveProjects(data) {
  localStorage.setItem(STORAGE_KEY_PROJECTS, JSON.stringify(data));
}

// Initialize data on first load
if (!localStorage.getItem(INIT_KEY)) {
  localStorage.setItem(STORAGE_KEY_HOTSPOTS, JSON.stringify(EMBEDDED_HOTSPOTS));
  localStorage.setItem(STORAGE_KEY_MATERIALS, JSON.stringify(EMBEDDED_MATERIALS));
  localStorage.setItem(STORAGE_KEY_PROJECTS, JSON.stringify([]));
  localStorage.setItem(INIT_KEY, '1');
}

// Flatten hotspots for easy access
function getFlatHotspots() {
  const data = getHotspots();
  const flat = [];
  for (const platform in data) {
    const items = data[platform];
    if (Array.isArray(items)) {
      items.forEach(item => flat.push(item));
    }
  }
  return flat;
}

// ==================== Toast ====================
function showToast(msg) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2200);
}

// ==================== Tab Navigation ====================
document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
    this.classList.add('active');
    const tabId = 'tab-' + this.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if (this.dataset.tab === 'hotspots') renderHotspots();
    else if (this.dataset.tab === 'materials') renderMaterials();
    else if (this.dataset.tab === 'workshop') renderWorkshop();
    else if (this.dataset.tab === 'dashboard') renderDashboard();
  });
});

// ==================== Hotspots Tab ====================
let hotspotFilter = { platform: 'all', keyword: '' };

function renderHotspots() {
  const container = document.getElementById('tab-hotspots');
  const flat = getFlatHotspots();
  const platforms = ['all', ...new Set(flat.map(h => h.platform).filter(Boolean))];

  let filtered = flat;
  if (hotspotFilter.platform !== 'all') {
    filtered = filtered.filter(h => h.platform === hotspotFilter.platform);
  }
  if (hotspotFilter.keyword) {
    const kw = hotspotFilter.keyword.toLowerCase();
    filtered = filtered.filter(h => h.title.toLowerCase().includes(kw) || (h.content && h.content.toLowerCase().includes(kw)));
  }

  let html = `
    <div class="search-bar">
      <select id="hs-platform-filter" style="flex:0 0 auto;min-width:100px">
        ${platforms.map(p => `<option value="${p}" ${p === hotspotFilter.platform ? 'selected' : ''}>${p === 'all' ? '全部平台' : p}</option>`).join('')}
      </select>
      <input type="text" id="hs-keyword" placeholder="搜索关键词..." value="${hotspotFilter.keyword}">
    </div>
    <div style="margin-bottom:12px;color:var(--text-muted);font-size:var(--font-xs)">
      共 ${filtered.length} 条热点
    </div>
  `;

  filtered.slice(0, 100).forEach(h => {
    const analysis = h.story_analysis || {};
    const score = analysis.story_score || 0;
    const categories = analysis.story_categories || [];
    const keywords = analysis.matched_keywords || [];
    const content = h.content || '';
    const comments = h.top_comments || [];

    html += `
      <div class="card" onclick="this.classList.toggle('expanded')">
        <div class="card-header">
          <div class="card-title">${h.title}</div>
          <div class="card-badge">${h.platform || ''}</div>
        </div>
        <div class="card-meta">
          <span>#${h.rank != null ? h.rank + 1 : '-'}</span>
          ${h.heat ? `<span>${h.heat}</span>` : ''}
          ${score > 0 ? `<span style="color:var(--accent)">故事感: ${score}</span>` : ''}
        </div>
        <div style="margin-top:6px">
          ${keywords.map(k => `<span class="tag">${k}</span>`).join('')}
          ${categories.map(c => `<span class="tag" style="background:var(--accent-dim);color:var(--accent)">${c.category}</span>`).join('')}
        </div>
        <div class="card-expand">
          ${content ? `<div style="margin-bottom:8px"><strong>内容摘要:</strong> ${content.substring(0, 300)}</div>` : ''}
          ${comments.length > 0 ? `<div><strong>高赞评论:</strong><br>${comments.slice(0, 3).map(c => `<div style="margin:4px 0;padding:6px;background:var(--bg-input);border-radius:4px;font-size:var(--font-xs)">${c}</div>`).join('')}</div>` : ''}
          ${h.url ? `<div style="margin-top:8px"><a href="${h.url}" target="_blank" style="color:var(--accent);font-size:var(--font-xs)">查看原文</a></div>` : ''}
        </div>
      </div>
    `;
  });

  if (filtered.length > 100) {
    html += `<div style="text-align:center;color:var(--text-muted);padding:10px">仅显示前100条，请使用筛选缩小范围</div>`;
  }

  container.innerHTML = html;

  // Bind filters
  const pf = document.getElementById('hs-platform-filter');
  const kw = document.getElementById('hs-keyword');
  if (pf) pf.addEventListener('change', function() { hotspotFilter.platform = this.value; renderHotspots(); });
  if (kw) kw.addEventListener('input', function() { hotspotFilter.keyword = this.value; renderHotspots(); });
}

// ==================== Materials Tab ====================
let currentLibrary = 'hot_meme';
let materialSearch = '';
let materialPage = 1;
const PAGE_SIZE = 10;

function renderMaterials() {
  const container = document.getElementById('tab-materials');
  const materials = getMaterials();

  // Sidebar
  let sidebarHtml = '';
  LIBRARY_GROUPS.forEach(group => {
    sidebarHtml += `<div class="library-group open">
      <div class="library-group-header" onclick="this.parentElement.classList.toggle('open')">${group.name}</div>
      <div class="library-group-items">`;
    group.libraries.forEach(lib => {
      const cfg = LIBRARY_CONFIG[lib];
      const count = materials[lib] ? (materials[lib].items || []).length : 0;
      sidebarHtml += `<div class="library-item${currentLibrary === lib ? ' active' : ''}" data-lib="${lib}">${cfg.icon} ${cfg.name} <span style="font-size:10px;color:var(--text-muted)">(${count})</span></div>`;
    });
    sidebarHtml += `</div></div>`;
  });

  // Main content
  const cfg = LIBRARY_CONFIG[currentLibrary];
  const libData = materials[currentLibrary] || { items: [] };
  let items = libData.items || [];

  // Search
  if (materialSearch) {
    const kw = materialSearch.toLowerCase();
    items = items.filter(item => {
      return Object.values(item).some(v => String(v).toLowerCase().includes(kw));
    });
  }

  // Pagination
  const totalPages = Math.ceil(items.length / PAGE_SIZE) || 1;
  if (materialPage > totalPages) materialPage = totalPages;
  const start = (materialPage - 1) * PAGE_SIZE;
  const pageItems = items.slice(start, start + PAGE_SIZE);

  // Table
  let tableHtml = `<table class="material-table"><thead><tr>`;
  cfg.fields.slice(0, 5).forEach(f => {
    tableHtml += `<th>${f.label}</th>`;
  });
  tableHtml += `<th style="width:60px">操作</th></tr></thead><tbody>`;

  pageItems.forEach((item, idx) => {
    tableHtml += `<tr>`;
    cfg.fields.slice(0, 5).forEach(f => {
      const val = item[f.key] || '';
      tableHtml += `<td title="${val}">${val.length > 30 ? val.substring(0, 30) + '...' : val}</td>`;
    });
    tableHtml += `<td>
      <button class="btn btn-sm btn-secondary" onclick="editMaterial('${currentLibrary}', ${start + idx})" title="编辑">✏</button>
      <button class="btn btn-sm btn-danger" onclick="deleteMaterial('${currentLibrary}', ${start + idx})" title="删除">×</button>
    </td></tr>`;
  });

  if (pageItems.length === 0) {
    tableHtml += `<tr><td colspan="${cfg.fields.length + 1}" style="text-align:center;padding:20px;color:var(--text-muted)">暂无数据</td></tr>`;
  }

  tableHtml += `</tbody></table>`;

  // Pagination controls
  let paginationHtml = `<div class="pagination">
    <button class="btn btn-sm btn-secondary" onclick="changeMaterialPage(${materialPage - 1})" ${materialPage <= 1 ? 'disabled' : ''}>上一页</button>
    <span>${materialPage} / ${totalPages}</span>
    <button class="btn btn-sm btn-secondary" onclick="changeMaterialPage(${materialPage + 1})" ${materialPage >= totalPages ? 'disabled' : ''}>下一页</button>
  </div>`;

  container.innerHTML = `
    <div class="library-layout">
      <div class="library-sidebar">${sidebarHtml}</div>
      <div class="library-main">
        <div class="library-toolbar">
          <strong style="font-size:var(--font-md)">${cfg.icon} ${cfg.name}</strong>
          <input type="text" class="library-search" id="material-search" placeholder="搜索..." value="${materialSearch}">
          <button class="btn btn-sm btn-primary" onclick="addMaterial('${currentLibrary}')">+ 添加</button>
          <button class="btn btn-sm btn-success" onclick="autoFillMaterials()">一键填入</button>
          <button class="btn btn-sm btn-secondary" onclick="exportLibraryCSV('${currentLibrary}')">导出CSV</button>
        </div>
        ${tableHtml}
        ${paginationHtml}
      </div>
    </div>
  `;

  // Bind sidebar clicks
  container.querySelectorAll('.library-item').forEach(el => {
    el.addEventListener('click', function() {
      currentLibrary = this.dataset.lib;
      materialPage = 1;
      materialSearch = '';
      renderMaterials();
    });
  });

  // Bind search
  const searchInput = document.getElementById('material-search');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      materialSearch = this.value;
      materialPage = 1;
      renderMaterials();
    });
  }
}

function changeMaterialPage(page) {
  materialPage = page;
  renderMaterials();
}

function addMaterial(libKey) {
  showMaterialModal(libKey, null, -1);
}

function editMaterial(libKey, idx) {
  showMaterialModal(libKey, idx, idx);
}

function deleteMaterial(libKey, idx) {
  if (!confirm('确定要删除这条素材吗？')) return;
  const materials = getMaterials();
  const libData = materials[libKey] || { items: [] };
  libData.items.splice(idx, 1);
  libData.meta = libData.meta || {};
  libData.meta.total = libData.items.length;
  saveMaterials(materials);
  showToast('已删除');
  renderMaterials();
}

function showMaterialModal(libKey, idx, originalIdx) {
  const materials = getMaterials();
  const libData = materials[libKey] || { items: [] };
  const cfg = LIBRARY_CONFIG[libKey];
  const isEdit = idx >= 0;
  const item = isEdit ? (libData.items[idx] || {}) : {};

  let formHtml = cfg.fields.map(f => {
    const val = item[f.key] || '';
    const input = f.key === 'id' || f.key === 'created_at' || f.key === 'updated_at' || f.key === 'source' || f.key === 'source_hotspot_id' || f.key === 'source_title'
      ? `<input type="text" name="${f.key}" value="${val}" readonly style="opacity:0.5">`
      : `<input type="text" name="${f.key}" value="${val}">`;
    return `<div class="form-group"><label>${f.label}</label>${input}</div>`;
  }).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? '编辑' : '添加'}素材 - ${cfg.name}</h3>
      <form id="material-form">${formHtml}</form>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" id="save-material-btn">保存</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  overlay.querySelector('#save-material-btn').addEventListener('click', function() {
    const form = document.getElementById('material-form');
    const data = {};
    cfg.fields.forEach(f => {
      const input = form.querySelector(`[name="${f.key}"]`);
      if (input) data[f.key] = input.value;
    });

    if (isEdit) {
      Object.assign(libData.items[originalIdx], data);
    } else {
      data.id = 'mat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      data.created_at = new Date().toISOString();
      data.updated_at = new Date().toISOString();
      data.source = 'manual';
      libData.items.push(data);
    }

    libData.meta = libData.meta || {};
    libData.meta.total = libData.items.length;
    libData.meta.updated_at = new Date().toISOString();
    saveMaterials(materials);
    overlay.remove();
    showToast(isEdit ? '已更新' : '已添加');
    renderMaterials();
  });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
}

function autoFillMaterials() {
  if (!confirm('将使用嵌入的热点数据自动填入素材库。这会跳过已存在的条目。确定继续？')) return;

  const hotspots = getFlatHotspots();
  const materials = getMaterials();
  const results = {};

  const allLibs = ['hot_meme', 'conflict', 'hook', 'reversal', 'character', 'scene', 'legal_risk', 'vocabulary', 'emotion', 'scenery', 'action', 'dialogue', 'quote'];

  allLibs.forEach(libKey => {
    const libData = materials[libKey] || { items: [], meta: { name: LIBRARY_CONFIG[libKey].name } };
    const existingIds = new Set((libData.items || []).map(i => i.source_hotspot_id).filter(Boolean));
    let count = 0;

    hotspots.forEach(h => {
      const items = extractForLibrary(libKey, h);
      items.forEach(item => {
        if (item.source_hotspot_id && existingIds.has(item.source_hotspot_id)) return;
        // Check content
        let hasContent = false;
        for (const k in item) {
          if (!['id', 'source', 'created_at', 'updated_at', 'source_hotspot_id', 'source_title'].includes(k) && item[k]) {
            hasContent = true;
            break;
          }
        }
        if (!hasContent) return;

        item.id = 'auto_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        item.created_at = new Date().toISOString();
        item.updated_at = new Date().toISOString();
        libData.items.push(item);
        if (item.source_hotspot_id) existingIds.add(item.source_hotspot_id);
        count++;
      });
    });

    libData.meta = libData.meta || {};
    libData.meta.total = libData.items.length;
    libData.meta.updated_at = new Date().toISOString();
    materials[libKey] = libData;
    results[libKey] = count;
  });

  saveMaterials(materials);
  const total = Object.values(results).reduce((a, b) => a + b, 0);
  showToast(`一键填入完成，共新增 ${total} 条素材`);
  renderMaterials();
}

function extractForLibrary(libKey, hotspot) {
  const title = hotspot.title || '';
  const content = hotspot.content || '';
  const hotType = hotspot.hot_type || '';
  const analysis = hotspot.story_analysis || {};
  const storyType = analysis.story_type || '';
  const emotionDensity = analysis.emotion_density || 0;
  const score = analysis.story_score || 0;
  const categories = analysis.story_categories || [];
  const keywords = analysis.matched_keywords || [];
  const platform = hotspot.platform || '';
  const heat = hotspot.heat || '';
  const comments = hotspot.top_comments || [];
  const hotspotId = `${platform}_${hotspot.rank}_${title.substring(0, 20)}`;

  const base = {
    source: 'auto_from_hotspot',
    source_hotspot_id: hotspotId,
    source_title: title
  };

  switch (libKey) {
    case 'hot_meme': {
      const items = [];
      if (hotType === '脑洞词条' || title.includes('梗') || title.includes('热梗')) {
        items.push({ ...base, type_tag: hotType, source_platform: platform, core_conflict: (content || title).substring(0, 200), adaptation_direction: storyType, multi_platform_heat: heat, suitable_plot: (content || title).substring(0, 200) });
      }
      const memeKws = ['彩礼', '出轨', '离婚', '相亲', '渣', '翻车', '塌房', '反转', '逆袭', '替身'];
      if (memeKws.some(kw => title.includes(kw))) {
        items.push({ ...base, type_tag: '社会热梗', source_platform: platform, core_conflict: (content || title).substring(0, 200), adaptation_direction: storyType, sweet_angst_index: emotionDensity > 0.5 ? '5' : '3', multi_platform_heat: heat, suitable_plot: (content || title).substring(0, 200) });
      }
      return items;
    }
    case 'conflict': {
      for (const cat of categories) {
        if (['情感冲突', '社会冲突'].includes(cat.category) && emotionDensity > 0) {
          return [{ ...base, conflict_type: cat.category, source_platform: platform, core_contradiction: (content || title).substring(0, 200), emotion_curve: '峰值' + emotionDensity, suitable_relationship: cat.story_type, risk_level: emotionDensity > 0.3 ? '★★' : '★', adaptation_direction: cat.story_type, suitable_plot: (content || title).substring(0, 200) }];
        }
      }
      return [];
    }
    case 'hook': {
      if (score >= 30) {
        let hookType = '悬念';
        const catNames = categories.map(c => c.category);
        if (catNames.includes('猎奇与反转')) hookType = '转折';
        else if (catNames.includes('情感冲突')) hookType = '情绪';
        else if (catNames.includes('社会冲突')) hookType = '信息';
        return [{ ...base, hook_type: hookType, type_tag: categories.slice(0, 2).map(c => c.category).join(','), core_element: title, emotion_orientation: score > 60 ? '虐' : '甜虐平衡', hook_density: score > 50 ? '中' : '低', suitable_plot: content.substring(0, 200) }];
      }
      return [];
    }
    case 'reversal': {
      for (const cat of categories) {
        if (cat.category === '猎奇与反转') {
          return [{ ...base, reversal_type: '猎奇反转', surface_presentation: title, truth_reveal: (content || title).substring(0, 300), emotion_impact: score > 50 ? '★★★★' : '★★★', suitable_genre: cat.story_type, suitable_plot: (content || title).substring(0, 200) }];
        }
      }
      return [];
    }
    case 'character': {
      if (!content) return [];
      const patterns = [/([\u4e00-\u9fa5]{2,4}(?:女|男|人|者|主|角|手|方|夫|妻|母|父|儿|子|女|孩|生|师|长|员))/g];
      const found = new Set();
      patterns.forEach(p => {
        const matches = content.match(p) || [];
        matches.forEach(m => { if (m.length >= 2) found.add(m); });
      });
      if (found.size > 0) {
        const arr = [...found];
        return [{ ...base, role_positioning: arr.slice(0, 3).join('、'), surface_traits: title, occupation_identity: arr[0] || '', suitable_plot: content.substring(0, 200) }];
      }
      return [];
    }
    case 'scene': {
      if (!content || score < 20) return [];
      const sceneKws = { '法庭': '法庭对峙', '医院': '医院场景', '婚礼': '婚礼场景', '葬礼': '葬礼场景', '办公室': '办公室场景', '深夜': '深夜独处', '餐厅': '餐厅场景', '学校': '校园场景', '地铁': '公共交通', '机场': '机场离别', '雨中': '雨中场景', '海边': '海边场景' };
      for (const [kw, st] of Object.entries(sceneKws)) {
        if (content.includes(kw) || title.includes(kw)) {
          return [{ ...base, scene_type: st, visual_focus: content.substring(0, 200), suitable_plot: content.substring(0, 200), emotion_intensity: String(score) }];
        }
      }
      return [];
    }
    case 'legal_risk': {
      const legalKws = ['判决', '法院', '离婚', '合同', '协议', '继承', '赔偿', '诈骗', '侵权', '婚姻', '财产', '抚养'];
      if (platform === '裁判文书网' || legalKws.some(kw => (title + content).includes(kw))) {
        const isMarriage = ['婚姻', '离婚', '继承'].some(kw => title.includes(kw));
        return [{ ...base, risk_type: isMarriage ? '婚姻纠纷' : '民事纠纷', legal_basis: '民法典相关', trigger_condition: (content || title).substring(0, 200), reality_prototype: title, adaptation_plan: '建议将具体法律细节模糊化处理', suitable_plot: (content || title).substring(0, 200) }];
      }
      return [];
    }
    case 'vocabulary': {
      return keywords.slice(0, 5).map(kw => ({
        ...base, core_word: kw, category: categories[0] ? categories[0].category : '', suitable_genre: storyType
      }));
    }
    case 'emotion': {
      if (emotionDensity > 0.5) {
        const emap = { '情感冲突': '愤怒/悲伤', '社会冲突': '焦虑/无力感', '猎奇与反转': '震惊/好奇' };
        let etype = '复杂情绪';
        for (const cat of categories) { etype = emap[cat.category] || etype; break; }
        return [{ ...base, core_emotion: etype, intensity_level: String(Math.round(emotionDensity * 10 * 10) / 10), suitable_scene: title, case_source: platform }];
      }
      return [];
    }
    case 'scenery': {
      if (!content) return [];
      const timeP = ['深夜', '清晨', '黄昏', '傍晚', '黎明', '午夜', '午后', '凌晨'];
      const placeP = ['城市', '乡村', '山间', '海边', '小镇', '都市', '废墟', '花园', '城堡'];
      const tf = timeP.filter(t => content.includes(t) || title.includes(t));
      const pf = placeP.filter(p => content.includes(p) || title.includes(p));
      if (tf.length > 0 || pf.length > 0) {
        const sp = pf.length > 0 ? `${tf.slice(0, 2).join(',')}的${pf.slice(0, 2).join(',')}` : tf.slice(0, 2).join(',');
        return [{ ...base, spacetime_coordinate: sp, optical_description: content.substring(0, 200), dynamic_element: title, era_tag: '当代' }];
      }
      return [];
    }
    case 'action': {
      if (!content) return [];
      const matches = content.match(/([\u4e00-\u9fa5]+(?:推|拉|打|摔|冲|闯|撕|砸|拍|踢|夺|追|逃|躲|藏|翻|跳|爬|钻|扔|丢|扯|拽|拖|抱|搂|吻|咬|哭|笑|怒|吼))/g);
      const actions = matches ? [...new Set(matches.filter(a => a.length >= 3))] : [];
      if (actions.length > 0) {
        return [{ ...base, main_action: actions[0], scene_type: title, chain_reaction: actions.slice(0, 3).join('、'), rhythm_value: '3' }];
      }
      return [];
    }
    case 'dialogue': {
      return comments.slice(0, 3).map(c => {
        const clean = c.replace(/^\[\d+赞\]\s*/, '').trim();
        if (!clean) return null;
        return { ...base, surface_dialogue: clean, conflict_type: '社会讨论', information_density: clean.length > 30 ? '高' : '中', source_chapter: title };
      }).filter(Boolean);
    }
    case 'quote': {
      return comments.slice(0, 3).map(c => {
        const clean = c.replace(/^\[\d+赞\]\s*/, '').trim();
        if (!clean || clean.length < 10) return null;
        return { ...base, quote_content: clean, type_tag: '网友神评', cross_library_impact: String(Math.min(10, Math.round(emotionDensity * 10 + 3))), suitable_plot: title };
      }).filter(Boolean);
    }
    default:
      return [];
  }
}

function exportLibraryCSV(libKey) {
  const materials = getMaterials();
  const libData = materials[libKey] || { items: [] };
  const cfg = LIBRARY_CONFIG[libKey];
  const items = libData.items || [];

  if (items.length === 0) {
    showToast('没有数据可导出');
    return;
  }

  const headers = cfg.fields.map(f => f.label);
  const keys = cfg.fields.map(f => f.key);
  const rows = items.map(item => keys.map(k => {
    const v = item[k] || '';
    return v.includes(',') || v.includes('"') || v.includes('\n') ? '"' + v.replace(/"/g, '""') + '"' : v;
  }));

  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cfg.name}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV已导出');
}

          <th style="width:60px">字数</th>
          <th style="width:60px">场景数</th>
          <th style="width:80px">钩子类型</th>
          <th style="width:60px">情绪值</th>
          <th style="width:60px">操作</th>
        </tr></thead>
        <tbody>`;

    (p.chapters || []).forEach((ch, ci) => {
      html += `<tr>
        <td>${ci + 1}</td>
        <td><input value="${ch.name || ''}" onchange="updateChapter(${ci},'name',this.value)"></td>
        <td><input value="${ch.event || ''}" onchange="updateChapter(${ci},'event',this.value)"></td>
        <td><input type="number" value="${ch.wordCount || ''}" onchange="updateChapter(${ci},'wordCount',this.value)"></td>
        <td><input type="number" value="${ch.sceneCount || ''}" onchange="updateChapter(${ci},'sceneCount',this.value)"></td>
        <td><select onchange="updateChapter(${ci},'hookType',this.value)" style="width:100%;background:var(--bg-input);color:var(--text-primary);border:1px solid transparent;font-size:var(--font-xs)">
          <option value="">-</option>
          <option ${ch.hookType==='悬念'?'selected':''}>悬念</option>
          <option ${ch.hookType==='转折'?'selected':''}>转折</option>
          <option ${ch.hookType==='情绪'?'selected':''}>情绪</option>
          <option ${ch.hookType==='信息'?'selected':''}>信息</option>
        </select></td>
        <td><input type="number" min="0" max="10" value="${ch.emotion || ''}" onchange="updateChapter(${ci},'emotion',this.value)"></td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteChapter(${ci})">×</button></td>
      </tr>`;
    });

    html += `</tbody></table></div>`;

    // Analysis results
    if (p.analysis) {
      html += renderAnalysis(p);
    }
  }

  container.innerHTML = html;
}

function createProject() {
  const name = document.getElementById('proj-name').value.trim();
  const author = document.getElementById('proj-author').value.trim();
  const type = document.getElementById('proj-type').value;
  if (!name) { showToast('请输入书名'); return; }

  const projects = getProjects();
  projects.push({ id: 'proj_' + Date.now(), name, author, type, chapters: [], analysis: null, createdAt: new Date().toISOString() });
  saveProjects(projects);
  showToast('项目已创建');
  renderWorkshop();
}

function openProject(idx) {
  currentProject = idx;
  renderWorkshop();
}

function deleteProject(idx) {
  if (!confirm('确定删除此项目？')) return;
  const projects = getProjects();
  projects.splice(idx, 1);
  saveProjects(projects);
  if (currentProject === idx) currentProject = null;
  showToast('已删除');
  renderWorkshop();
}

function addChapter() {
  const projects = getProjects();
  const p = projects[currentProject];
  p.chapters = p.chapters || [];
  p.chapters.push({ name: '', event: '', wordCount: '', sceneCount: '', hookType: '', emotion: '' });
  saveProjects(projects);
  renderWorkshop();
}

function deleteChapter(ci) {
  const projects = getProjects();
  projects[currentProject].chapters.splice(ci, 1);
  saveProjects(projects);
  renderWorkshop();
}

function updateChapter(ci, field, value) {
  const projects = getProjects();
  projects[currentProject].chapters[ci][field] = value;
  saveProjects(projects);
}

function analyzeProject() {
  const projects = getProjects();
  const p = projects[currentProject];
  const chapters = p.chapters || [];

  if (chapters.length === 0) { showToast('请先添加章节'); return; }

  const analysis = {
    totalChapters: chapters.length,
    totalWords: chapters.reduce((s, c) => s + (parseInt(c.wordCount) || 0), 0),
    totalScenes: chapters.reduce((s, c) => s + (parseInt(c.sceneCount) || 0), 0),
    emotions: chapters.map(c => parseFloat(c.emotion) || 0),
    hookTypes: {},
    avgWordsPerChapter: 0,
    emotionPeaks: [],
    rhythmIssues: []
  };

  // Hook distribution
  chapters.forEach(c => {
    if (c.hookType) analysis.hookTypes[c.hookType] = (analysis.hookTypes[c.hookType] || 0) + 1;
  });

  // Average words
  analysis.avgWordsPerChapter = chapters.length > 0 ? Math.round(analysis.totalWords / chapters.length) : 0;

  // Emotion peaks
  const emotions = analysis.emotions;
  let maxE = Math.max(...emotions, 0);
  let minE = Math.min(...emotions, 10);
  emotions.forEach((e, i) => {
    if (e === maxE) analysis.emotionPeaks.push(i + 1);
  });

  // Rhythm diagnosis
  if (analysis.avgWordsPerChapter > 5000) analysis.rhythmIssues.push('章节平均字数偏高，建议控制在3000-5000字');
  if (analysis.avgWordsPerChapter < 1500 && analysis.avgWordsPerChapter > 0) analysis.rhythmIssues.push('章节平均字数偏低，可能节奏过快');
  const hookCount = Object.values(analysis.hookTypes).reduce((a, b) => a + b, 0);
  if (hookCount < chapters.length * 0.5) analysis.rhythmIssues.push('钩子密度不足，建议每章至少1个钩子');
  if (maxE - minE < 3 && chapters.length > 3) analysis.rhythmIssues.push('情绪波动不足，建议制造更大起伏');
  if (!analysis.rhythmIssues.length) analysis.rhythmIssues.push('节奏整体良好');

  p.analysis = analysis;
  saveProjects(projects);
  renderWorkshop();
}

function renderAnalysis(p) {
  const a = p.analysis;
  let html = '<div class="analysis-results"><h3 style="font-size:var(--font-md);margin-bottom:10px">分析结果</h3>';

  html += `<div class="analysis-card">
    <h4>基本统计</h4>
    <div style="font-size:var(--font-sm)">总章节: ${a.totalChapters} | 总字数: ${a.totalWords} | 平均字数/章: ${a.avgWordsPerChapter} | 总场景数: ${a.totalScenes}</div>
  </div>`;

  html += `<div class="analysis-card">
    <h4>钩子分布</h4>
    <div style="font-size:var(--font-sm)">${Object.entries(a.hookTypes).map(([k, v]) => `<span class="tag" style="background:var(--accent-dim);color:var(--accent)">${k}: ${v}次</span>`).join(' ') || '无数据'}</div>
  </div>`;

  html += `<div class="analysis-card">
    <h4>情绪峰值章节</h4>
    <div style="font-size:var(--font-sm)">${a.emotionPeaks.length > 0 ? a.emotionPeaks.join(', ') : '无'}</div>
  </div>`;

  html += `<div class="analysis-card">
    <h4>节奏诊断</h4>
    <div style="font-size:var(--font-sm)">${a.rhythmIssues.map(i => `<div style="margin:4px 0;padding:4px 8px;background:var(--bg-input);border-radius:4px">${i}</div>`).join('')}</div>
  </div>`;

  // Emotion curve chart
  html += `<div class="chart-container">
    <h4 style="font-size:var(--font-sm);color:var(--accent);margin-bottom:8px">情绪曲线</h4>
    <canvas id="emotion-chart" width="600" height="250"></canvas>
  </div>`;

  // Render chart after DOM update
  setTimeout(() => {
    const canvas = document.getElementById('emotion-chart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const padding = 40;
    const pw = W - padding * 2;
    const ph = H - padding * 2;
    const emotions = a.emotions;

    // Background
    ctx.fillStyle = '#f8fafd';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const y = padding + (ph * i / 10);
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(W - padding, y);
      ctx.stroke();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px sans-serif';
      ctx.fillText(String(10 - i), 5, y + 3);
    }

    // Data line
    if (emotions.length > 1) {
      ctx.strokeStyle = '#5b9bd5';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const stepX = pw / (emotions.length - 1 || 1);
      emotions.forEach((e, i) => {
        const x = padding + stepX * i;
        const y = padding + ph - (ph * Math.min(e, 10) / 10);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Points
      ctx.fillStyle = '#e8738a';
      emotions.forEach((e, i) => {
        const x = padding + stepX * i;
        const y = padding + ph - (ph * Math.min(e, 10) / 10);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
        // Chapter label
        ctx.fillStyle = '#5a6d80';
        ctx.font = '9px sans-serif';
        ctx.fillText(`C${i + 1}`, x - 8, y - 10);
        ctx.fillStyle = '#e8738a';
      });
    }

    // X axis label
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px sans-serif';
    ctx.fillText('章节', W / 2 - 15, H - 5);
  }, 100);

  html += '</div>';
  return html;
}

function exportProjectCSV() {
  const projects = getProjects();
  const p = projects[currentProject];
  const chapters = p.chapters || [];
  if (chapters.length === 0) { showToast('无数据'); return; }

  const headers = ['序号', '章节名', '事件', '字数', '场景数', '钩子类型', '情绪值'];
  const rows = chapters.map((c, i) => [
    i + 1, c.name || '', c.event || '', c.wordCount || '', c.sceneCount || '', c.hookType || '', c.emotion || ''
  ]);

  const csv = ['\uFEFF' + headers.join(','), ...rows.map(r => r.map(v => String(v).includes(',') ? '"' + v + '"' : v).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${p.name}_拆解_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV已导出');
}

// ==================== Dashboard Tab ====================
function renderDashboard() {
  const container = document.getElementById('tab-dashboard');
  const hotspots = getFlatHotspots();
  const materials = getMaterials();
  const projects = getProjects();

  let totalMaterials = 0;
  const libCounts = {};
  for (const key in materials) {
    const count = (materials[key].items || []).length;
    totalMaterials += count;
    libCounts[LIBRARY_CONFIG[key] ? LIBRARY_CONFIG[key].name : key] = count;
  }

  // Story category distribution
  const catDist = {};
  hotspots.forEach(h => {
    const cats = (h.story_analysis && h.story_analysis.story_categories) || [];
    cats.forEach(c => {
      catDist[c.category] = (catDist[c.category] || 0) + 1;
    });
  });

  let html = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${hotspots.length}</div><div class="stat-label">热点总数</div></div>
      <div class="stat-card"><div class="stat-value">${totalMaterials}</div><div class="stat-label">素材总数</div></div>
      <div class="stat-card"><div class="stat-value">${projects.length}</div><div class="stat-label">拆解项目数</div></div>
      <div class="stat-card"><div class="stat-value">${Object.keys(catDist).length}</div><div class="stat-label">故事核分类</div></div>
    </div>

    <div class="analysis-card">
      <h4>故事核分类分布</h4>
      <div style="font-size:var(--font-sm);margin-top:6px">
        ${Object.entries(catDist).map(([k, v]) => `<span class="tag" style="background:var(--accent-dim);color:var(--accent);margin:3px">${k}: ${v}</span>`).join('') || '无数据'}
      </div>
    </div>

    <div class="analysis-card">
      <h4>素材库各分类条目数</h4>
      <div style="font-size:var(--font-sm);margin-top:6px">
        ${Object.entries(libCounts).map(([k, v]) => `<span class="tag" style="margin:3px">${k}: ${v}</span>`).join('')}
      </div>
    </div>
  `;

  container.innerHTML = html;
}
