name: 部署到 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install pandas openpyxl
      
      - name: 生成站点数据
        run: |
          python3 << 'PYEOF'
          import json, os, shutil, re
          
          os.makedirs('_site', exist_ok=True)
          
          # 读取 offline.html
          with open('static/offline.html', 'r', encoding='utf-8') as f:
              html = f.read()
          
          # 注入最新热点数据到 EMBEDDED_HOTSPOTS
          hotspots_file = 'data/hotspots.json'
          if os.path.exists(hotspots_file):
              with open(hotspots_file, 'r', encoding='utf-8') as f:
                  hotspots_data = json.load(f)
              hotspots_json = json.dumps(hotspots_data, ensure_ascii=False)
              # 替换 EMBEDDED_HOTSPOTS 的值
              html = re.sub(
                  r'const EMBEDDED_HOTSPOTS = \{.*?\};',
                  'const EMBEDDED_HOTSPOTS = ' + hotspots_json + ';',
                  html,
                  flags=re.DOTALL
              )
              print(f"已注入热点数据: {sum(len(v) for v in hotspots_data.values())} 条")
          
          # 注入最新素材库数据到 EMBEDDED_MATERIALS
          materials = {}
          material_dir = 'data/material_archive'
          if os.path.exists(material_dir):
              for f in os.listdir(material_dir):
                  if f.endswith('.json'):
                      key = f.replace('.json', '')
                      with open(os.path.join(material_dir, f), 'r', encoding='utf-8') as mf:
                          materials[key] = json.load(mf)
          
          if materials:
              materials_json = json.dumps(materials, ensure_ascii=False)
              html = re.sub(
                  r'const EMBEDDED_MATERIALS = \{.*?\};',
                  'const EMBEDDED_MATERIALS = ' + materials_json + ';',
                  html,
                  flags=re.DOTALL
              )
              print(f"已注入素材库数据: {sum(len(v.get('items',[])) for v in materials.values())} 条")
          
          # 写入 _site/index.html
          with open('_site/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          
          # 同时复制热点JSON（供JS fetch使用）
          if os.path.exists(hotspots_file):
              shutil.copy(hotspots_file, '_site/hotspots.json')
          
          # 复制素材库数据
          if os.path.exists(material_dir):
              os.makedirs('_site/material_archive', exist_ok=True)
              for f in os.listdir(material_dir):
                  if f.endswith('.json'):
                      shutil.copy(os.path.join(material_dir, f), os.path.join('_site/material_archive', f))
          
          index_file = 'data/material_index.json'
          if os.path.exists(index_file):
              shutil.copy(index_file, '_site/material_index.json')
          
          print("站点文件准备完成")
          for f in os.listdir('_site'):
              size = os.path.getsize(os.path.join('_site', f))
              print(f"  {f}: {size} bytes")
          PYEOF
      
      - name: 设置 Pages
        uses: actions/configure-pages@v4
      
      - name: 上传 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
